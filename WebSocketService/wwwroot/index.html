<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
</head>
<body>
    <h1>WebSocket Test</h1>
    <div id="status">Disconnected</div>
    <button onclick="connect()">Connect</button>
    <button onclick="disconnect()">Disconnect</button>
    <div id="messages"></div>

    <script>
        let socket = null;
        let socket2 = null;

        function connect() {
            // Port numarasını 5245 olarak değiştir
            socket = new WebSocket('ws://localhost:5138/ws/create');
            socket2 = new WebSocket('ws://localhost:5138/ws/update');


            socket.onopen = function () {
                document.getElementById('status').innerText = 'Connected (Create)';
                addMessage('Create socket bağlantısı kuruldu');
            };

            socket2.onopen = function () {
                document.getElementById('status').innerText = 'Connected (Both)';
                addMessage('Update socket bağlantısı kuruldu');
            };

            socket.onmessage = function (event) {
                const data = JSON.parse(event.data);
                addMessage(`[CREATE] Topic: ${data.Topic}, Data: ${JSON.stringify(data.Data)}`);
            };

            socket2.onmessage = function (event) {
                const data = JSON.parse(event.data);
                addMessage(`[UPDATE] Topic: ${data.Topic}, Data: ${JSON.stringify(data.Data)}`);
            };

            socket.onclose = function () {
                document.getElementById('status').innerText = 'Disconnected';
                addMessage('Create socket bağlantısı kapandı');
            };

            socket2.onclose = function () {
                document.getElementById('status').innerText = 'Disconnected';
                addMessage('Update socket bağlantısı kapandı');
            };

            socket.onerror = function (error) {
                addMessage('Create WebSocket Hatası: Bağlantı problemi oluştu');
                console.error('Create WebSocket error:', error);
            };

            socket2.onerror = function (error) {
                addMessage('Update WebSocket Hatası: Bağlantı problemi oluştu');
                console.error('Update WebSocket error:', error);
            };
        }

        function disconnect() {
            if (socket) {
                socket.close();
            }
            if (socket2) {
                socket2.close();
            }
        }

        function addMessage(message) {
            const div = document.createElement('div');
            div.innerText = new Date().toLocaleTimeString() + ': ' + message;
            document.getElementById('messages').appendChild(div);
        }
    </script>
</body>
</html>
